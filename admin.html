<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDICARE Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 6px;
            padding: 12px 16px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        /* LOGIN */

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            margin-bottom: 15px;
        }

        .login-btn {
            width: 100%;
            background: #111;
            color: white;
        }

        .error {
            color: #d00;
            text-align: center;
            margin-top: 15px;
        }

        /* ADMIN */

        #admin-panel {
            display: none;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            letter-spacing: 2px;
        }

        .logout-btn {
            background: white;
            color: #111;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-heading {
            margin-bottom: 20px;
        }

        .section-heading h1 {
            margin-bottom: 5px;
        }

        .section-heading p {
            color: #777;
        }

        /* PRODUCT FORM */

        .product-form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
        }

        .product-save-btn {
            background: #111;
            color: white;
            margin-top: 20px;
            width: 100%;
        }

        .cancel-edit-btn {
            background: #ddd;
            margin-top: 10px;
            width: 100%;
            display: none;
        }

        /* PRODUCTS */

        .products-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #eee;
        }

        .product-content {
            padding: 18px;
        }

        .product-content h3 {
            margin-bottom: 8px;
        }

        .product-description {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .stock {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn {
            background: #111;
            color: white;
            flex: 1;
        }

        .delete-btn {
            background: #ddd;
            color: #111;
            flex: 1;
        }

        /* ORDERS */

        .orders-container {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            background: #eee;
            font-size: 13px;
            font-weight: bold;
        }

        .customer-info {
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .items {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            margin-bottom: 15px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }

        .price-info {
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
        }

        .status-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-btn {
            background: #111;
            color: white;
        }

        .cancel-btn {
            background: #ddd;
            color: #111;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        @media (max-width: 800px) {
            .products-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .products-container {
                grid-template-columns: 1fr;
            }

            .order-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="login-section" class="login-box">

        <h1>VEDICARE</h1>

        <p>Admin Panel Login</p>

        <input
            type="email"
            id="admin-email"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="admin-password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            onclick="adminLogin()"
        >
            LOGIN
        </button>

        <div id="login-error" class="error"></div>

    </div>


    <!-- ========================= -->
    <!-- ADMIN PANEL -->
    <!-- ========================= -->

    <div id="admin-panel">

        <div class="navbar">

            <h2>VEDICARE ADMIN</h2>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <div class="container">


            <!-- ========================= -->
            <!-- PRODUCTS -->
            <!-- ========================= -->

            <div class="section">

                <div class="section-heading">

                    <h1>Products</h1>

                    <p>
                        Add and manage your products
                    </p>

                </div>


                <!-- PRODUCT FORM -->

                <div class="product-form">

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Product Name</label>

                            <input
                                type="text"
                                id="product-name"
                                placeholder="Glass Cleaner 500ml"
                            >

                        </div>


                        <div class="form-group">

                            <label>Price (₹)</label>

                            <input
                                type="number"
                                id="product-price"
                                placeholder="150"
                                min="0"
                            >

                        </div>


                        <div class="form-group">

                            <label>Stock</label>

                            <input
                                type="number"
                                id="product-stock"
                                placeholder="50"
                                min="0"
                            >

                        </div>


                        <div class="form-group">

                            <label>Image URL</label>

                            <input
                                type="url"
                                id="product-image"
                                placeholder="https://..."
                            >

                        </div>


                        <div class="form-group full-width">

                            <label>Description</label>

                            <textarea
                                id="product-description"
                                rows="4"
                                placeholder="Product description..."
                            ></textarea>

                        </div>

                    </div>


                    <button
                        class="product-save-btn"
                        id="save-product-btn"
                        onclick="saveProduct()"
                    >
                        ADD PRODUCT
                    </button>


                    <button
                        class="cancel-edit-btn"
                        id="cancel-edit-btn"
                        onclick="cancelEdit()"
                    >
                        CANCEL EDIT
                    </button>

                </div>


                <!-- PRODUCT LIST -->

                <div
                    id="products-container"
                    class="products-container"
                >

                    <div class="empty">
                        Loading products...
                    </div>

                </div>

            </div>


            <!-- ========================= -->
            <!-- ORDERS -->
            <!-- ========================= -->

            <div class="section">

                <div class="section-heading">

                    <h1>Orders</h1>

                    <p>
                        Manage customer orders
                    </p>

                </div>


                <div
                    id="orders-container"
                    class="orders-container"
                >

                    <div class="empty">
                        Loading orders...
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- FIREBASE -->
    <!-- ========================= -->

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>


    <script>

        // =========================
        // FIREBASE CONFIG
        // =========================

        const firebaseConfig = {

            apiKey: "AIzaSyBiBdmJqF5sIFzylG6Fq89epJ2DaaA3qwU",

            authDomain:
                "vedicare-3d079.firebaseapp.com",

            projectId:
                "vedicare-3d079",

            storageBucket:
                "vedicare-3d079.firebasestorage.app",

            messagingSenderId:
                "415571474130",

            appId:
                "1:415571474130:web:ed8db68575238c31d9df0b",

            measurementId:
                "G-42DL6T7HLD"
        };


        firebase.initializeApp(firebaseConfig);


        const db =
            firebase.firestore();

        const auth =
            firebase.auth();


        const ADMIN_UID =
            "G9UtDi2O8ObKiWZJdgYl8rYPE4K3";


        let editingProductId = null;


        // =========================
        // LOGIN
        // =========================

        function adminLogin() {

            const email =
                document
                    .getElementById("admin-email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("admin-password")
                    .value;

            const errorBox =
                document.getElementById("login-error");

            errorBox.textContent = "";


            if (!email || !password) {

                errorBox.textContent =
                    "Email and password required.";

                return;
            }


            auth.signInWithEmailAndPassword(
                email,
                password
            )

            .then((userCredential) => {

                const user =
                    userCredential.user;


                if (user.uid !== ADMIN_UID) {

                    auth.signOut();

                    errorBox.textContent =
                        "You are not authorized as admin.";

                    return;
                }


                showAdminPanel();

            })

            .catch((error) => {

                console.error(
                    "LOGIN ERROR:",
                    error
                );

                errorBox.textContent =
                    error.code +
                    " — " +
                    error.message;

            });
        }


        // =========================
        // AUTH STATE
        // =========================

        auth.onAuthStateChanged((user) => {

            if (
                user &&
                user.uid === ADMIN_UID
            ) {

                showAdminPanel();

            } else {

                showLogin();

            }

        });


        function showAdminPanel() {

            document
                .getElementById("login-section")
                .style.display = "none";

            document
                .getElementById("admin-panel")
                .style.display = "block";


            loadOrders();

            loadProducts();
        }


        function showLogin() {

            document
                .getElementById("login-section")
                .style.display = "block";

            document
                .getElementById("admin-panel")
                .style.display = "none";
        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            auth.signOut();

        }


        // =========================
        // PRODUCTS - LOAD
        // =========================

        function loadProducts() {

            const container =
                document.getElementById(
                    "products-container"
                );


            db.collection("products")
                .orderBy("createdAt", "desc")
                .onSnapshot(

                    (snapshot) => {

                        if (snapshot.empty) {

                            container.innerHTML = `
                                <div class="empty">
                                    No products yet.
                                </div>
                            `;

                            return;
                        }


                        container.innerHTML = "";


                        snapshot.forEach((doc) => {

                            const product =
                                doc.data();


                            container.innerHTML +=
                                createProductCard(
                                    doc.id,
                                    product
                                );

                        });

                    },

                    (error) => {

                        console.error(error);

                        container.innerHTML = `
                            <div class="empty">
                                Unable to load products.
                            </div>
                        `;

                    }
                );
        }


        // =========================
        // PRODUCT CARD
        // =========================

        function createProductCard(
            productId,
            product
        ) {

            return `

                <div class="product-card">

                    <img
                        class="product-image"
                        src="${escapeHTML(product.image || "")}"
                        alt="${escapeHTML(product.name || "")}"
                        onerror="this.src='https://via.placeholder.com/600x600?text=No+Image'"
                    >

                    <div class="product-content">

                        <h3>
                            ${escapeHTML(product.name || "")}
                        </h3>

                        <div class="product-description">
                            ${escapeHTML(product.description || "")}
                        </div>

                        <div class="product-price">
                            ₹${Number(product.price || 0).toFixed(2)}
                        </div>

                        <div class="stock">
                            Stock:
                            ${Number(product.stock || 0)}
                        </div>


                        <div class="product-actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct('${productId}')"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteProduct('${productId}')"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                </div>

            `;
        }


        // =========================
        // ADD / UPDATE PRODUCT
        // =========================

        async function saveProduct() {

            const name =
                document
                    .getElementById("product-name")
                    .value
                    .trim();

            const price =
                Number(
                    document
                        .getElementById("product-price")
                        .value
                );

            const stock =
                Number(
                    document
                        .getElementById("product-stock")
                        .value
                );

            const image =
                document
                    .getElementById("product-image")
                    .value
                    .trim();

            const description =
                document
                    .getElementById("product-description")
                    .value
                    .trim();


            if (!name) {

                alert("Product name required.");

                return;
            }


            if (
                isNaN(price) ||
                price < 0
            ) {

                alert("Enter a valid price.");

                return;
            }


            if (
                isNaN(stock) ||
                stock < 0
            ) {

                alert("Enter a valid stock quantity.");

                return;
            }


            if (!image) {

                alert("Image URL required.");

                return;
            }


            const productData = {

                name: name,

                price: price,

                stock: stock,

                image: image,

                description: description,

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            };


            try {

                if (editingProductId) {

                    await db
                        .collection("products")
                        .doc(editingProductId)
                        .update(productData);


                    alert("Product updated successfully.");

                } else {

                    productData.createdAt =
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp();


                    await db
                        .collection("products")
                        .add(productData);


                    alert("Product added successfully.");

                }


                clearProductForm();

            } catch (error) {

                console.error(error);

                alert(
                    "Could not save product."
                );

            }

        }


        // =========================
        // EDIT PRODUCT
        // =========================

        async function editProduct(productId) {

            try {

                const doc =
                    await db
                        .collection("products")
                        .doc(productId)
                        .get();


                if (!doc.exists) {

                    alert("Product not found.");

                    return;
                }


                const product =
                    doc.data();


                document
                    .getElementById("product-name")
                    .value =
                        product.name || "";


                document
                    .getElementById("product-price")
                    .value =
                        product.price || 0;


                document
                    .getElementById("product-stock")
                    .value =
                        product.stock || 0;


                document
                    .getElementById("product-image")
                    .value =
                        product.image || "";


                document
                    .getElementById("product-description")
                    .value =
                        product.description || "";


                editingProductId =
                    productId;


                document
                    .getElementById("save-product-btn")
                    .textContent =
                        "UPDATE PRODUCT";


                document
                    .getElementById("cancel-edit-btn")
                    .style.display =
                        "block";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            } catch (error) {

                console.error(error);

                alert(
                    "Could not load product."
                );

            }
        }


        // =========================
        // DELETE PRODUCT
        // =========================

        async function deleteProduct(productId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this product?"
                );


            if (!confirmDelete) {

                return;
            }


            try {

                await db
                    .collection("products")
                    .doc(productId)
                    .delete();


                alert(
                    "Product deleted successfully."
                );

            } catch (error) {

                console.error(error);

                alert(
                    "Could not delete product."
                );

            }
        }


        // =========================
        // CANCEL EDIT
        // =========================

        function cancelEdit() {

            clearProductForm();

        }


        // =========================
        // CLEAR FORM
        // =========================

        function clearProductForm() {

            document
                .getElementById("product-name")
                .value = "";

            document
                .getElementById("product-price")
                .value = "";

            document
                .getElementById("product-stock")
                .value = "";

            document
                .getElementById("product-image")
                .value = "";

            document
                .getElementById("product-description")
                .value = "";


            editingProductId = null;


            document
                .getElementById("save-product-btn")
                .textContent =
                    "ADD PRODUCT";


            document
                .getElementById("cancel-edit-btn")
                .style.display =
                    "none";
        }


        // =========================
        // ORDERS - LOAD
        // =========================

        function loadOrders() {

            const container =
                document.getElementById(
                    "orders-container"
                );


            db.collection("orders")
                .orderBy("createdAt", "desc")
                .onSnapshot(

                    (snapshot) => {

                        if (snapshot.empty) {

                            container.innerHTML = `
                                <div class="empty">
                                    No orders yet.
                                </div>
                            `;

                            return;
                        }


                        container.innerHTML = "";


                        snapshot.forEach((doc) => {

                            const order =
                                doc.data();


                            container.innerHTML +=
                                createOrderCard(
                                    doc.id,
                                    order
                                );

                        });

                    },

                    (error) => {

                        console.error(error);

                        container.innerHTML = `
                            <div class="empty">
                                Unable to load orders.
                            </div>
                        `;

                    }
                );
        }


        // =========================
        // ORDER CARD
        // =========================

        function createOrderCard(
            orderId,
            order
        ) {

            const customer =
                order.customer || {};


            let itemsHTML = "";


            (order.items || []).forEach(
                (item) => {

                    itemsHTML += `

                        <div class="item">

                            <span>
                                ${escapeHTML(item.name)}
                                × ${item.quantity}
                            </span>

                            <span>
                                ₹${Number(
                                    item.price *
                                    item.quantity
                                ).toFixed(2)}
                            </span>

                        </div>

                    `;

                }
            );


            return `

                <div class="order-card">

                    <div class="order-header">

                        <div>

                            <div class="order-number">
                                ${escapeHTML(
                                    order.orderNumber ||
                                    orderId
                                )}
                            </div>

                            <small>
                                ${formatDate(
                                    order.createdAt
                                )}
                            </small>

                        </div>


                        <div class="status">
                            ${escapeHTML(
                                order.status || "New"
                            )}
                        </div>

                    </div>


                    <div class="customer-info">

                        <strong>Customer</strong><br>

                        Name:
                        ${escapeHTML(
                            customer.name || ""
                        )}
                        <br>

                        Phone:
                        ${escapeHTML(
                            customer.phone || ""
                        )}
                        <br>

                        Address:
                        ${escapeHTML(
                            customer.address || ""
                        )}
                        <br>

                        PIN:
                        ${escapeHTML(
                            customer.pincode || ""
                        )}
                        <br>

                        State:
                        ${escapeHTML(
                            customer.state || ""
                        )}

                    </div>


                    <div class="items">

                        <strong>Products</strong>

                        ${itemsHTML}

                    </div>


                    <div class="price-info">

                        Subtotal:
                        ₹${Number(
                            order.subtotal || 0
                        ).toFixed(2)}

                        <br>

                        Shipping:
                        ${
                            Number(
                                order.shipping || 0
                            ) === 0
                            ? "FREE"
                            : "₹" +
                              Number(
                                  order.shipping
                              ).toFixed(2)
                        }

                        <br>

                        <span class="total">
                            Total:
                            ₹${Number(
                                order.total || 0
                            ).toFixed(2)}
                        </span>

                    </div>


                    <div class="status-controls">

                        <button
                            class="status-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'Accepted'
                            )"
                        >
                            Accept
                        </button>


                        <button
                            class="status-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'Packed'
                            )"
                        >
                            Packed
                        </button>


                        <button
                            class="status-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'Delivered'
                            )"
                        >
                            Delivered
                        </button>


                        <button
                            class="cancel-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'Cancelled'
                            )"
                        >
                            Cancel
                        </button>

                    </div>

                </div>

            `;
        }


        // =========================
        // UPDATE ORDER STATUS
        // =========================

        function updateOrderStatus(
            orderId,
            newStatus
        ) {

            db.collection("orders")
                .doc(orderId)
                .update({
                    status: newStatus
                })

                .then(() => {

                    console.log(
                        "Order status updated:",
                        newStatus
                    );

                })

                .catch((error) => {

                    console.error(error);

                    alert(
                        "Could not update order status."
                    );

                });
        }


        // =========================
        // DATE
        // =========================

        function formatDate(timestamp) {

            if (!timestamp) {

                return "Date unavailable";
            }


            try {

                return timestamp
                    .toDate()
                    .toLocaleString("en-IN");

            } catch (error) {

                return "Date unavailable";
            }
        }


        // =========================
        // HTML SECURITY
        // =========================

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;
        }

    </script>
